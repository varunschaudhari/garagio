name: Android APK

# Actions → Android APK → "Run workflow". Builds on Expo's servers (EAS); the download link appears in the
# log and on expo.dev. Setup once: EXPO_TOKEN secret + `npx eas-cli init` committed (docs/DEPLOY.md § 8).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile (preview = APK to share with staff)
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: Check setup
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::Add the EXPO_TOKEN secret (expo.dev → Account settings → Access tokens)."; exit 1; }
          node -e "const a=require('./app.json'); if (!a.expo.extra?.eas?.projectId) { console.log('::error::Run \"npx eas-cli init\" in mobile/ once and commit app.json (it adds extra.eas.projectId).'); process.exit(1); }"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - name: Build on EAS
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
