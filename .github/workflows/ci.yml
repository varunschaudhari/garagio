name: CI

# Every branch push runs CI (a pull request shows the checks of its branch's last push).
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GM_TEST_DB_HOST: 127.0.0.1
  GM_TEST_DB_PORT: 3306
  GM_TEST_DB_USER: root
  GM_TEST_DB_PASS: devroot

jobs:
  api:
    name: API tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devroot
          TZ: Asia/Kolkata
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdevroot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, zlib, openssl
          coverage: none
      - name: PHP syntax check
        run: find public_html tests tools -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: API tests
        run: php tests/run.php

  e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devroot
          TZ: Asia/Kolkata
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdevroot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, curl, zlib, openssl
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
        env:
          PHP_BIN: php
          TZ: Asia/Kolkata
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: tests/e2e/test-results
          retention-days: 7

  mobile:
    name: Mobile app checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Translations (en/mr keys, mobile copies)
        run: node ../tools/check-i18n.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - name: Android bundle
        run: npx expo export --platform android --output-dir /tmp/expo-export
